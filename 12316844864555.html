  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  cv.style.width=w+"px"; cv.style.height=h+"px";
}

window.addEventListener("resize",passe);

const korn=document.createElement("canvas"); korn.width=korn.height=160;
(function(){ const k=korn.getContext("2d"), d=k.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){ const v=200+(Math.random()*55|0);
    d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=Math.random()*90|0; }
  k.putImageData(d,0,0); })();

/* ---------- Geometrie: ein Feld, von Rand zu Rand ---------- */
function geo(){
  const W=Wpx,H=Hpx, g={W:W,H:H};
  g.kompakt = W < 820;
  g.aT = H*0.016; g.aB = g.kompakt ? H*0.895 : H*0.905;
  g.marke = Math.max(80, Math.min(150, W*0.075));
  g.i0 = Math.max(0, Math.min(HEUTE-200, idxVonDatum(S.jahr+"-01-01")));
  /* y-Bereich an das sichtbare Fenster anpassen */
  let lo=Infinity, hi=-Infinity;
  const om=Math.max(mvOf(S.b), mvOf(ALT_MARKE));
  for(let i=g.i0;i<N;i++){
    const r=RP[i];
    if(P[i]<lo) lo=P[i];
    if(r<lo) lo=r;
    const h2=Math.max(P[i], om*r);
    if(h2>hi) hi=h2;
  }
  g.pLo = lo*0.62; g.pHi = hi*1.34;
  return g;
}
function xT(g,i){ return (i-g.i0)/(HEUTE-g.i0)*g.W; }
function yP(g,p){
  const lo=Math.log10(g.pLo), hi=Math.log10(g.pHi);
  return g.aB-(Math.log10(Math.max(p,g.pLo*0.5))-lo)/(hi-lo)*(g.aB-g.aT);
}

/* ---------- Bausteine ---------- */
function fmt(x,n){ return Number(x).toLocaleString("de-DE",{minimumFractionDigits:n||0,maximumFractionDigits:n||0}); }
function plaette(txt,x,y,size,farbe,al,ausricht){
  cx.save(); cx.globalAlpha=al===undefined?1:al;
  cx.font="600 "+size+"px Segoe UI,system-ui,Arial";
  cx.textAlign=ausricht||"center"; cx.textBaseline="middle";
  const w=cx.measureText(txt).width+16, h=size*1.62;
  const x0 = ausricht==="left"? x-7 : ausricht==="right"? x-w+7 : x-w/2;
  cx.fillStyle="rgba(0,0,0,.72)"; cx.fillRect(x0,y-h/2,w,h);
  cx.fillStyle=farbe||"rgba(255,255,255,.88)"; cx.fillText(txt,x,y);
  cx.restore();
  return w;
}
/* Achsenbeschriftung: transparenter Hintergrund, Lesbarkeit ueber eine dunkle Kontur */
function achsText(txt,x,y,size,farbe,al,ausricht){
  cx.save(); cx.globalAlpha=al===undefined?1:al;
  cx.font="700 "+size+"px Segoe UI,system-ui,Arial";
  cx.textAlign=ausricht||"center"; cx.textBaseline="middle";
  cx.lineJoin="round"; cx.miterLimit=2;
  cx.lineWidth=Math.max(3, size*0.26);
  cx.strokeStyle="rgba(0,0,0,.82)"; cx.strokeText(txt,x,y);
  cx.fillStyle=farbe||"rgba(255,255,255,.90)"; cx.fillText(txt,x,y);
  cx.restore();
}

function kurve(g,f,von,bis){
  cx.beginPath();
  for(let i=von;i<=bis;i++){ const x=xT(g,i), y=yP(g,f(i));
    if(i===von) cx.moveTo(x,y); else cx.lineTo(x,y); }
}

/* ================= Euphorie-Abschnitte ================= */
function abschnitte(){
  const a=[]; let start=-1;
  for(let i=0;i<N;i++){
    if(NU[i]>=S.b){ if(start<0) start=i; }
    else if(start>=0){ a.push([start,i-1]); start=-1; }
  }
  if(start>=0) a.push([start,N-1]);
  return a;
}

/* ================= Das Feld ================= */
function zeichneFeld(g,F){
  const al=F.feldAlpha===undefined?1:F.feldAlpha;
  if(al<=0.002) return;
  const pr=F.pProg===undefined?1:F.pProg;
  const bis=Math.max(g.i0+1, Math.round(g.i0+(HEUTE-g.i0)*pr));
  const zeig=F.linien===undefined?1:F.linien;
  cx.save(); cx.globalAlpha=al;
  cx.beginPath(); cx.rect(0,g.aT,g.W,g.aB-g.aT); cx.clip();

  /* --- Gitter --- */
  const dec=[];
  for(let e=-1;e<=6;e++){ const v=Math.pow(10,e); if(v>=g.pLo&&v<=g.pHi) dec.push(v); }
  for(const v of dec){
    for(const m2 of [2,5]){
      const vm=v*m2; if(vm<g.pLo||vm>g.pHi) continue;
      const ym=yP(g,vm);
      cx.beginPath(); cx.moveTo(0,ym); cx.lineTo(g.W,ym);
      cx.strokeStyle="rgba(255,255,255,.028)"; cx.lineWidth=1; cx.stroke();
    }
    const y=yP(g,v);
    cx.beginPath(); cx.moveTo(0,y); cx.lineTo(g.W,y);
    cx.strokeStyle="rgba(255,255,255,.085)"; cx.lineWidth=1; cx.stroke();
  }
  for(let j=JAHR0+1;j<=JAHR1;j++){
    const i=idxVonDatum(j+"-01-01"); if(i<g.i0||i>HEUTE) continue;
    cx.beginPath(); cx.moveTo(xT(g,i),g.aT); cx.lineTo(xT(g,i),g.aB);
    cx.strokeStyle="rgba(255,255,255,.055)"; cx.lineWidth=1; cx.stroke();
  }

  if(zeig>0.002){
    cx.globalAlpha=al*zeig;
    /* --- auslaufende Baender an den beiden Grenzlinien --- */
    const band=(f1,f2,farbe,a)=>{
      cx.beginPath();
      kurve(g,i=>f1(i),g.i0,bis);
      for(let i=bis;i>=g.i0;i--) cx.lineTo(xT(g,i),yP(g,f2(i)));
      cx.closePath(); cx.fillStyle=rgba(farbe,a); cx.fill();
    };
    band(i=>RP[i], i=>RP[i]*0.72, TUERKIS, 0.15);
    band(i=>RP[i]*0.72, i=>RP[i]*0.50, TUERKIS, 0.085);
    band(i=>RP[i]*0.50, i=>RP[i]*0.30, TUERKIS, 0.04);
    band(i=>grenze(i,S.b), i=>grenze(i,S.b)*1.45, ORANGE, 0.17);
    band(i=>grenze(i,S.b)*1.45, i=>grenze(i,S.b)*2.2, ORANGE, 0.095);
    band(i=>grenze(i,S.b)*2.2, i=>grenze(i,S.b)*3.6, ORANGE, 0.045);

    /* --- wo der Kurs wirklich unter den Einstand faellt --- */
    let a=g.i0;
    while(a<=bis){
      if(P[a]>=RP[a]){ a++; continue; }
      let b=a; while(b+1<=bis && P[b+1]<RP[b+1]) b++;
      cx.beginPath();
      for(let i=a;i<=b;i++){ const x=xT(g,i);
        if(i===a) cx.moveTo(x,yP(g,P[i])); else cx.lineTo(x,yP(g,P[i])); }
      for(let i=b;i>=a;i--) cx.lineTo(xT(g,i),yP(g,RP[i]));
      cx.closePath(); cx.fillStyle=rgba(TUERKIS,0.42); cx.fill();
      a=b+1;
    }

    /* --- wo der Kurs wirklich ueber der Marke liegt: Zeitmarke plus Fuellung --- */
    for(const [q0,q1] of abschnitte()){
      if(q1<g.i0||q0>bis) continue;
      const a2=Math.max(q0,g.i0), b2=Math.min(q1,bis);
      const x0=xT(g,a2), x1=Math.max(xT(g,b2), x0+2.2);
      const gr2=cx.createLinearGradient(0,g.aT,0,g.aB);
      gr2.addColorStop(0,rgba(ORANGE,0.19)); gr2.addColorStop(0.55,rgba(ORANGE,0.05));
      gr2.addColorStop(1,rgba(ORANGE,0.0));
      cx.fillStyle=gr2; cx.fillRect(x0,g.aT,x1-x0,g.aB-g.aT);
      cx.fillStyle=rgba(ORANGE,0.42); cx.fillRect(x0,g.aT,x1-x0,2.0);
      cx.beginPath();
      for(let i=a2;i<=b2;i++){ const x=xT(g,i);
        if(i===a2) cx.moveTo(x,yP(g,P[i])); else cx.lineTo(x,yP(g,P[i])); }
      for(let i=b2;i>=a2;i--) cx.lineTo(xT(g,i),yP(g,grenze(i,S.b)));
      cx.closePath();
      cx.fillStyle=rgba(ORANGE,0.68); cx.fill();
    }

    /* --- Einstandspreis --- */
    cx.setLineDash([8,7]);
    kurve(g,i=>RP[i],g.i0,bis);
    cx.strokeStyle="rgba(255,255,255,.58)"; cx.lineWidth=2.6; cx.stroke();
    /* --- alte Marke 0,75 --- */
    cx.setLineDash([4,9]);
    kurve(g,i=>grenze(i,ALT_MARKE),g.i0,bis);
    cx.strokeStyle="rgba(178,188,214,.80)"; cx.lineWidth=3.0; cx.stroke();
    cx.setLineDash([]);
    /* --- Euphoriegrenze: die tragende Linie --- */
    cx.lineJoin="round"; cx.lineCap="round";
    kurve(g,i=>grenze(i,S.b),g.i0,bis);
    cx.strokeStyle=rgba(ORANGE,0.16); cx.lineWidth=14; cx.stroke();
    kurve(g,i=>grenze(i,S.b),g.i0,bis);
    cx.strokeStyle=ORANGE; cx.lineWidth=4.6;
    cx.shadowColor=rgba(ORANGE,0.85); cx.shadowBlur=16; cx.stroke();
    cx.shadowBlur=0; cx.stroke();
    kurve(g,i=>grenze(i,S.b),g.i0,bis);
    cx.strokeStyle="rgba(255,214,150,.55)"; cx.lineWidth=1.5; cx.stroke();
    cx.globalAlpha=al;
  }

  /* --- Kurslinie, eingefaerbt nach Zustand --- */
  cx.lineWidth=4.4; cx.lineJoin="round"; cx.lineCap="round";
  let start=g.i0;
  while(start<bis){
    const z=zustand(start);
    let e=start;
    while(e+1<=bis && zustand(e+1)===z) e++;
    cx.beginPath();
    for(let i=start;i<=Math.min(e+1,bis);i++){ const x=xT(g,i), y=yP(g,P[i]);
      if(i===start) cx.moveTo(x,y); else cx.lineTo(x,y); }
    cx.strokeStyle = z===2?ORANGE : z===0?TUERKIS : WEISS;
    /* Schein nur auf den weissen Abschnitten — sonst blutet Farbe in Farbe */
    if(z===1){ cx.shadowColor="rgba(255,255,255,.7)"; cx.shadowBlur=14; }
    cx.stroke(); cx.shadowBlur=0;
    start=e+1;
  }
  cx.restore();

  /* --- Puls am heutigen Punkt --- */
  if(pr>=0.999){
    cx.save(); cx.globalAlpha=al;
    const pul=0.5+0.5*Math.sin(JETZT/1000*Math.PI);
    const x=xT(g,HEUTE), y=yP(g,P[HEUTE]);
    cx.beginPath(); cx.arc(x,y,7.5+4.5*pul,0,6.2832);
    cx.strokeStyle="rgba(255,255,255,"+(0.70-0.45*pul)+")"; cx.lineWidth=3; cx.stroke();
    cx.beginPath(); cx.arc(x,y,6.4,0,6.2832);
    cx.fillStyle=WEISS; cx.shadowColor="#fff"; cx.shadowBlur=14; cx.fill(); cx.shadowBlur=0;
    cx.restore();
  }
}

/* ================= Beschriftung im Bild ================= */
function zeichneAchsen(g,F){
  const al=F.achsAlpha===undefined?(F.feldAlpha===undefined?1:F.feldAlpha):F.achsAlpha;
  if(al<=0.002) return;
  /* Zielgroesse: bei 1280 rund 22 px — im Video auch auf dem Handy lesbar */
  const gr=Math.max(16,Math.min(32,g.W*0.0176));
  cx.save(); cx.globalAlpha=al;
  for(let e=-1;e<=6;e++){
    const v=Math.pow(10,e); if(v<g.pLo||v>g.pHi) continue;
    const y=yP(g,v); if(y<g.aT+gr||y>g.aB-gr*2.2) continue;
    achsText(v>=1000?fmt(v/1000)+"k $":(v<1?fmt(v,1):fmt(v))+" $", 10, y, gr,
             "rgba(255,255,255,.92)", 0.97, "left");
  }
  /* Jahresschritt so waehlen, dass die grossen Zahlen nebeneinander passen */
  cx.font="600 "+gr+"px Segoe UI,system-ui,Arial";
  const jb=cx.measureText("2024").width+34;
  let schritt=1;
  while(schritt<8 && ((JAHR1-JAHR0)/schritt+1)*jb > g.W*0.78) schritt++;
  for(let j=JAHR0+1;j<=JAHR1;j+=schritt){
    const i=idxVonDatum(j+"-01-01"); if(i<g.i0||i>HEUTE) continue;
    const xj=xT(g,i); if(xj<jb*0.5||xj>g.W-jb*0.5) continue;
    achsText(String(j), xj, g.aB-gr*0.85, gr, "rgba(255,255,255,.86)", 0.97, "center");
  }
  cx.restore();
}

/* Beschriftung der drei Linien — am linken Rand, nie am rechten Reihenende */
function zeichneLinienNamen(g,F){
  const al=(F.linien===undefined?1:F.linien)*(F.feldAlpha===undefined?1:F.feldAlpha);
  if(al<=0.002) return;
  const gr=Math.max(10,Math.min(13,g.W*0.0088));
  const i=Math.min(HEUTE, g.i0+Math.round((HEUTE-g.i0)*0.055));
  const x=xT(g,i)+10;
  const eintr=[
    [grenze(i,ALT_MARKE), "ALTE MARKE "+fmt(ALT_MARKE,2), GRAU],
    [grenze(i,S.b), "EUPHORIE AB "+fmt(S.b,2), ORANGE],
    [RP[i], "EINSTANDSPREIS", "rgba(255,255,255,.72)"]
  ];
  cx.save(); cx.globalAlpha=al;
  let vor=-1e9;
  for(const [p,t,f] of eintr.slice().sort((a,b)=>yP(g,b[0])-yP(g,a[0]))){
    let y=yP(g,p);
    if(y-vor<gr*1.9) y=vor+gr*1.9;
    vor=y;
    plaette(t, x, y, gr, f, 0.98, "left");
  }
  cx.restore();
}

/* ================= Hover: Fadenkreuz und Wertekarte ================= */
function zeichneHover(g,F){
  if(S.cinema!==null || !S.hov) return;
  if(S.hov.y<g.aT || S.hov.y>g.aB) return;
  let i=Math.round(g.i0+(S.hov.x/g.W)*(HEUTE-g.i0));
  i=Math.max(g.i0,Math.min(HEUTE,i));
  const x=xT(g,i), y=yP(g,P[i]), yg=yP(g,grenze(i,S.b)), ye=yP(g,RP[i]);
  const z=zustand(i);
  const farbe = z===2?ORANGE : z===0?TUERKIS : WEISS;
  const zn = z===2?"EUPHORIE" : z===0?"UNTER EINSTAND" : "DAZWISCHEN";
  const abst = 100*(grenze(i,S.b)/P[i]-1);
  cx.save();
  /* Fadenkreuz */
  cx.setLineDash([6,6]); cx.lineWidth=1.6; cx.strokeStyle="rgba(255,255,255,.42)";
  cx.beginPath(); cx.moveTo(x,g.aT); cx.lineTo(x,g.aB); cx.stroke();
  cx.setLineDash([]);
  /* Punkte auf den drei Linien */
  for(const [yy,ff,rr] of [[ye,"rgba(255,255,255,.75)",4.5],[yg,ORANGE,6.0],[y,farbe,8.0]]){
    cx.beginPath(); cx.arc(x,yy,rr+3.2,0,6.2832);
    cx.fillStyle="rgba(0,0,0,.85)"; cx.fill();
    cx.beginPath(); cx.arc(x,yy,rr,0,6.2832);
    cx.fillStyle=ff; cx.shadowColor=ff; cx.shadowBlur=14; cx.fill(); cx.shadowBlur=0;
  }
  /* Wertekarte */
  const gs=Math.max(15,Math.min(26,g.W*0.0148));
  const ks=Math.max(20,Math.min(38,g.W*0.0215));
  const zeilen=[
    ["k", fmt(P[i])+" $"],
    ["o", "Euphorie ab "+fmt(Math.round(grenze(i,S.b)))+" $"],
    ["g", "Einstand "+fmt(Math.round(RP[i]))+" $"],
    ["f", (abst>=0?"+":"")+fmt(abst,1)+" % bis zur Grenze"]
  ];
  cx.font="700 "+gs+"px Segoe UI,system-ui,Arial";
  let br=cx.measureText(dstr(i)).width;
  for(const [a2,t] of zeilen){
    cx.font=(a2==="k"?"800 "+ks:"700 "+gs)+"px Segoe UI,system-ui,Arial";
    br=Math.max(br,cx.measureText(t).width);
  }
  const pad=16, kb=br+pad*2, kh=pad*2+gs*1.35+ks*1.15+gs*1.35*3+6;
  let kx=x+22, ky=Math.min(Math.max(S.hov.y-kh/2,g.aT+8), g.aB-kh-8);
  if(kx+kb>g.W-14) kx=x-22-kb;
  if(kx<8) kx=8;
  cx.fillStyle="rgba(8,9,12,.93)";
  cx.beginPath();
  if(cx.roundRect) cx.roundRect(kx,ky,kb,kh,12); else cx.rect(kx,ky,kb,kh);
  cx.fill();
  cx.strokeStyle=rgba(farbe,0.55); cx.lineWidth=1.6; cx.stroke();
  cx.fillStyle=rgba(farbe,0.9); cx.fillRect(kx,ky,4,kh);
  cx.textAlign="left"; cx.textBaseline="top";
  let ty=ky+pad;
  cx.font="700 "+gs+"px Segoe UI,system-ui,Arial";
  cx.fillStyle="rgba(255,255,255,.55)"; cx.fillText(dstr(i)+"  ·  "+zn,kx+pad,ty);
  ty+=gs*1.35+4;
  cx.font="800 "+ks+"px Segoe UI,system-ui,Arial";
  cx.fillStyle=WEISS; cx.fillText(zeilen[0][1],kx+pad,ty);
  ty+=ks*1.15+2;
  cx.font="700 "+gs+"px Segoe UI,system-ui,Arial";
  for(let k=1;k<zeilen.length;k++){
    const [a2,t]=zeilen[k];
    cx.fillStyle = a2==="o"?ORANGE : a2==="g"?"rgba(255,255,255,.62)" : rgba(farbe,0.95);
    cx.fillText(t,kx+pad,ty); ty+=gs*1.35;
  }
  cx.restore();
}

/* ================= Zyklushochs ================= */
function zeichneHochs(g,F){
  const al=F.hochsAlpha===undefined?(S.marker?1:0):F.hochsAlpha;
  if(al<=0.002) return;
  const pr=F.hochsProg===undefined?1:F.hochsProg;
  const gr=Math.max(14,Math.min(28,g.W*0.0152));
  const belegt=[];
  cx.save();
  cx.font="600 "+gr+"px Segoe UI,system-ui,Arial";
  let k=0;
  for(const z of ZH){
    const i=idxVonDatum(z.t);
    if(i<g.i0||i>HEUTE){ k++; continue; }
    const lokal=Math.min(1,Math.max(0,(pr-k*0.10)/0.66)); k++;
    if(lokal<=0.001) continue;
    const treffer=z.n>=S.b;
    const x=xT(g,i), y=yP(g,P[i]);
    const aa=al*Math.min(1,lokal*2.4);
    cx.globalAlpha=aa;
    if(treffer){
      /* erreicht: voller Punkt in Bitcoin-Orange */
      cx.beginPath(); cx.arc(x,y,12.0,0,6.2832);
      cx.fillStyle="rgba(0,0,0,.88)"; cx.fill();
      cx.beginPath(); cx.arc(x,y,8.4,0,6.2832);
      cx.fillStyle=ORANGE; cx.shadowColor=ORANGE; cx.shadowBlur=20; cx.fill(); cx.shadowBlur=0;
      cx.beginPath(); cx.arc(x,y,8.4,0,6.2832);
      cx.strokeStyle="rgba(0,0,0,.5)"; cx.lineWidth=1.6; cx.stroke();
    } else {
      /* nicht erreicht: offener Ring — andere FORM, keine zusaetzliche Farbe */
      cx.beginPath(); cx.arc(x,y,13.5,0,6.2832);
      cx.fillStyle="rgba(0,0,0,.9)"; cx.fill();
      cx.beginPath(); cx.arc(x,y,9.6,0,6.2832);
      cx.strokeStyle=WEISS; cx.lineWidth=3.4;
      cx.shadowColor="rgba(255,255,255,.9)"; cx.shadowBlur=16; cx.stroke(); cx.shadowBlur=0;
      cx.beginPath(); cx.arc(x,y,3.0,0,6.2832);
      cx.fillStyle=WEISS; cx.fill();
    }
    if(lokal>0.45){
      const la=Math.min(1,(lokal-0.45)/0.35)*al;
      const t=z.t.slice(0,4)+" · "+fmt(z.p)+" $";
      const bw=cx.measureText(t).width+16, bh=gr*1.62;
      const rechts = x > g.W*0.70;
      const lx = rechts ? x-16-bw : x+16;
      /* erste freie Lage suchen, statt starr abzuwechseln */
      let ly=null;
      for(const dv of [-1.9,1.9,-3.5,3.5,-5.1,5.1,-6.7,6.7]){
        const yy=y+gr*dv;
        if(yy-bh/2 < g.aT+4 || yy+bh/2 > g.aB-gr*2.2) continue;
        let frei=true;
        for(const r of belegt)
          if(lx < r[0]+r[2] && lx+bw > r[0] && yy-bh/2 < r[1]+r[3] && yy+bh/2 > r[1]) frei=false;
        if(frei){ ly=yy; break; }
      }
      if(ly!==null){
        belegt.push([lx,ly-bh/2,bw,bh]);
        plaette(t, rechts?x-16:x+16, ly, gr, treffer?ORANGE:"rgba(255,255,255,.94)",
                la, rechts?"right":"left");
      }
    }
  }
  cx.restore();
}

function wortmarke(g,al){
  cx.save(); cx.globalAlpha=(al===undefined?1:al)*0.94;
  const x=18, y=g.H-50, ziel=g.marke;
  cx.textBaseline="alphabetic"; cx.textAlign="left";
  cx.font="800 26px Segoe UI,system-ui,Arial";
  const w1=cx.measureText("GREAT").width;
  cx.save(); cx.translate(x,y); cx.scale(ziel/w1,1);
  cx.fillStyle="#FFFFFF"; cx.fillText("GREAT",0,0); cx.restore();
  const w2a=cx.measureText("WALL").width, w2b=cx.measureText("Y").width;
  const sc=ziel/(w2a+w2b);
  cx.save(); cx.translate(x,y+26); cx.scale(sc,1);
  cx.fillStyle=ORANGE; cx.fillText("WALL",0,0);
  cx.fillStyle="#FFFFFF"; cx.fillText("Y",w2a,0); cx.restore();
  cx.restore();
}

function vignette(g,st){
  const gr=cx.createRadialGradient(g.W/2,g.H/2,Math.min(g.W,g.H)*0.36,g.W/2,g.H/2,Math.max(g.W,g.H)*0.82);
  gr.addColorStop(0,"rgba(0,0,0,0)"); gr.addColorStop(1,"rgba(0,0,0,"+(0.42*st)+")");
  cx.fillStyle=gr; cx.fillRect(0,0,g.W,g.H);
}
function balken(g,f){ if(f<=0.001) return;
  const h=g.H*0.12*f; cx.fillStyle="#000"; cx.fillRect(0,0,g.W,h); cx.fillRect(0,g.H-h,g.W,h); }
function grain(g,st){ if(st<=0.001) return;
  cx.save(); cx.globalAlpha=st*0.26; cx.globalCompositeOperation="overlay";
  for(let x=0;x<g.W;x+=160) for(let y=0;y<g.H;y+=160) cx.drawImage(korn,x,y);
  cx.restore(); }
function abdunkler(g,y,h){
  const gr=cx.createLinearGradient(0,y-h*0.8,0,y+h*1.3);
  gr.addColorStop(0,"rgba(0,0,0,0)"); gr.addColorStop(0.45,"rgba(0,0,0,.72)");
  gr.addColorStop(1,"rgba(0,0,0,0)");
  cx.fillStyle=gr; cx.fillRect(0,y-h*0.8,g.W,h*2.1);
}
function textOrange(zeile,x,y,size,al){
  const teile=zeile.split("*");
  cx.font="800 "+size+"px Segoe UI,system-ui,Arial";
  let ges=0; for(const t of teile) ges+=cx.measureText(t).width;
  let px=x-ges/2;
  cx.textAlign="left"; cx.globalAlpha=al;
  for(let k=0;k<teile.length;k++){
    cx.fillStyle=(k%2)?ORANGE:"#FFFFFF";
    cx.fillText(teile[k],px,y); px+=cx.measureText(teile[k]).width;
  }
  cx.textAlign="center";
}
function vollbildText(g,txt,al,yrel){
  const zeilen=txt.split("\n");
  let size=Math.round(Math.min(g.W*0.042,g.H*0.070));
  cx.save();
  for(let k=0;k<40;k++){
    cx.font="800 "+size+"px Segoe UI,system-ui,Arial";
    let br=0; for(const z of zeilen) br=Math.max(br,cx.measureText(z.replace(/\*/g,"")).width);
    if(br<g.W*0.86) break; size=Math.round(size*0.94);
  }
  const lh=size*1.30, y0=g.H*yrel-(zeilen.length-1)*lh/2;
  abdunkler(g,g.H*yrel,lh*zeilen.length*0.80);
  cx.textBaseline="middle";
  for(let k=0;k<zeilen.length;k++) textOrange(zeilen[k],g.W/2,y0+k*lh,size,al);
  cx.restore();
}
function banner(g,label,zeile,al){
  cx.save();
  const y=g.H*0.085;
  abdunkler(g,y,g.H*0.052);
  cx.textAlign="center"; cx.textBaseline="middle"; cx.globalAlpha=al;
  cx.font="700 "+Math.round(Math.max(12,g.W*0.0096))+"px Segoe UI,system-ui,Arial";
  cx.fillStyle="rgba(255,255,255,.60)"; cx.fillText(label,g.W/2,y-Math.max(16,g.H*0.026));
  let size=Math.round(Math.min(g.W*0.0200,g.H*0.035));
  for(let k=0;k<30;k++){ cx.font="800 "+size+"px Segoe UI,system-ui,Arial";
    if(cx.measureText(zeile.replace(/\*/g,"")).width < g.W*0.88) break; size=Math.round(size*0.94); }
  textOrange(zeile,g.W/2,y+size*0.30,size,al);
  cx.restore();
}
function grosseZahl(g,zahl,unter,al){
  cx.save(); cx.textAlign="center"; cx.textBaseline="middle";
  const size=Math.round(Math.min(g.W*0.115,g.H*0.18));
  const y=g.H*0.42;
  abdunkler(g,y,size*0.95); cx.globalAlpha=al;
  cx.font="800 "+size+"px Segoe UI,system-ui,Arial";
  cx.shadowColor="rgba(247,147,26,.55)"; cx.shadowBlur=36;
  cx.fillStyle=ORANGE; cx.fillText(zahl,g.W/2,y);
  cx.shadowBlur=0; cx.fillText(zahl,g.W/2,y);
  let s2=Math.round(Math.min(g.W*0.0185,g.H*0.031));
  for(let k=0;k<30;k++){ cx.font="700 "+s2+"px Segoe UI,system-ui,Arial";
    if(cx.measureText(unter.replace(/\*/g,"")).width < g.W*0.88) break; s2=Math.round(s2*0.94); }
  textOrange(unter,g.W/2,y+size*0.72,s2,al);
  cx.restore();
}

/* ============================ Sequenz ============================ */
const AKT=[{n:"haken",t:14000},{n:"welt",t:5600},{n:"modell",t:4600},
           {n:"kern",t:8100},{n:"urteil",t:3700},{n:"abspann",t:4000}];
const AKTZ=[]; (function(){ let s=0; for(const a of AKT){ AKTZ.push({n:a.n,a:s,b:s+a.t}); s+=a.t; } })();
const GESAMT=AKTZ[AKTZ.length-1].b;

function hookBeats(){
  const eu=mvOf(0.60)*RP[HEUTE];
  return [
    "DIE ÜBLICHE EUPHORIE-MARKE\nHAT SEIT *"+K.eu75_jahr+"* NICHTS MEHR GEZEIGT",
    "AUCH NICHT AM ALLZEITHOCH\nVON *"+fmt(K.ath_p)+" DOLLAR*",
    "NICHT DER MARKT HAT DIE EUPHORIE VERPASST\n*DIE MARKE STAND ZU HOCH*",
    "RICHTIG GEEICHT BEGINNT SIE\nBEI *"+fmt(Math.round(eu))+" DOLLAR*"
  ];
}

function frameFor(t){
  const F={feldAlpha:1,pProg:1,linien:1,hochsAlpha:1,hochsProg:1,uiAlpha:1,achsAlpha:1,
           bOverride:null,jahrOverride:null,
           balken:0,grain:0,vignette:1,camera:0,blitz:0,text:null,banner:null,zahl:null};
  let akt=AKTZ[AKTZ.length-1];
  for(const a of AKTZ) if(t>=a.a && t<a.b) akt=a;
  const lt=(t-akt.a)/(akt.b-akt.a);
  const ein=x=>Math.min(1,x/0.14), aus=x=>Math.min(1,(1-x)/0.14);
  const eu=mvOf(0.60)*RP[HEUTE];
  if(akt.n==="haken"){
    F.feldAlpha=0; F.uiAlpha=0; F.hochsAlpha=0; F.achsAlpha=0;
    F.balken=1; F.grain=0.55+0.40*lt;
    const k=Math.min(3,Math.floor(t/3500)), bl=(t-k*3500)/3500;
    F.text=hookBeats()[k];
    F.textAl=Math.min(1,bl/0.16)*Math.min(1,(1-bl)/0.16);
    if(k===2 && bl<0.14){ F.blitz=1-bl/0.14; F.grain=0.22; }
    if(k===3) F.grain=0.16;
  } else if(akt.n==="welt"){
    F.linien=0; F.hochsAlpha=0; F.uiAlpha=0.55*ein(lt);
    F.balken=1-Math.min(1,lt/0.35); F.grain=0.15;
    F.pProg=Math.min(1,lt/0.82); F.camera=0.012*lt;
    F.banner=["DER KURS","Von *"+fmt(P[0],2)+" $* im Jahr 2011 auf *"+fmt(P[HEUTE])+" $* heute"];
    F.bannerAl=ein(lt)*aus(lt);
  } else if(akt.n==="modell"){
    F.hochsAlpha=0; F.uiAlpha=0.75; F.grain=0.13;
    F.linien=Math.min(1,lt/0.55); F.camera=0.012+0.008*lt;
    F.banner=["DIE MARKE",
      "Euphorie beginnt beim *"+fmt(mvOf(0.60),1)+"-fachen* des Einstandspreises — heute *"
      +fmt(Math.round(eu))+" $*"];
    F.bannerAl=ein(lt)*aus(lt);
  } else if(akt.n==="kern"){
    F.uiAlpha=0.45; F.grain=0.11; F.camera=0.018;
    F.hochsProg=Math.min(1,Math.max(0,(lt-0.03)/0.40));
    const e=Math.min(1,Math.max(0,(lt-0.46)/0.46));
    const ee=e<0.5? 2*e*e : 1-Math.pow(-2*e+2,2)/2;
    F.bOverride=0.75+(0.60-0.75)*ee;
    F.banner=["DIE EICHUNG","Marke *"+fmt(F.bOverride,2)+"* — erfasst *"
      +trefferBei(F.bOverride)+" von "+ZH.length+"* Zyklushochs"];
    F.bannerAl=ein(lt)*aus(lt);
  } else if(akt.n==="urteil"){
    F.uiAlpha=0.25; F.grain=0.10; F.balken=Math.min(1,lt/0.30);
    F.feldAlpha=0.34; F.hochsAlpha=0.30; F.achsAlpha=0.20;
    F.jahrOverride=2023;
    F.zahl=[fmt(Math.round(eu))+" $",
      "HIER BEGINNT EUPHORIE — *"+fmt(100*(eu/K.ath_p-1),1)+" %* ÜBER DEM ALLZEITHOCH VON *"
      +fmt(K.ath_p)+" DOLLAR* · STAND "+dtxt(K.stichtag)];
    F.zahlAl=ein(lt)*aus(lt);
  } else {
    F.balken=Math.max(0,1-lt/0.35); F.grain=0.10; F.camera=0;
    F.banner=["DIE EUPHORIE-MARKE",
      "Nicht der Markt hat die Euphorie verpasst — *die Marke stand zu hoch*"];
    F.bannerAl=ein(lt);
  }
  return F;
}

/* ============================ Hauptzeichnung ============================ */
function render(now){
  JETZT = now;
  const wNow = window.innerWidth || document.documentElement.clientWidth || 1280;
  const hNow = window.innerHeight || document.documentElement.clientHeight || 720;
  if(Math.abs(wNow-Wpx)>1 || Math.abs(hNow-Hpx)>1) passe();

  let F={};
  if(S.cinema!==null) F=frameFor(Math.min(GESAMT-1, now-S.cinema));
  const bAlt=S.b, jAlt=S.jahr;
  if(F.bOverride!==null && F.bOverride!==undefined) S.b=F.bOverride;
  if(F.jahrOverride!==null && F.jahrOverride!==undefined) S.jahr=F.jahrOverride;

  const g=geo();
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle="#000"; cx.fillRect(0,0,g.W,g.H);
  const kam=F.camera||0;

  cx.save();
  if(kam>0){ cx.translate(g.W/2,g.H/2); cx.scale(1+kam,1+kam); cx.translate(-g.W/2,-g.H/2); }
  zeichneFeld(g,F);
  zeichneAchsen(g,F);
  zeichneHochs(g,F);
  zeichneHover(g,F);
  cx.restore();

  vignette(g,F.vignette===undefined?1:F.vignette);
  wortmarke(g,F.uiAlpha===undefined?1:F.uiAlpha);
  grain(g,F.grain||0);

  if(F.banner) banner(g,F.banner[0],F.banner[1],F.bannerAl===undefined?1:F.bannerAl);
  if(F.text) vollbildText(g,F.text,F.textAl===undefined?1:F.textAl,0.42);
  if(F.zahl) grosseZahl(g,F.zahl[0],F.zahl[1],F.zahlAl===undefined?1:F.zahlAl);
  balken(g,F.balken||0);
  if(F.blitz>0){ cx.fillStyle="rgba(255,255,255,"+(F.blitz*0.85)+")"; cx.fillRect(0,0,g.W,g.H); }

  S.b=bAlt; S.jahr=jAlt;
  if(S.cinema===null) aktualisierePanel();
}
function schleife(){
  const now=performance.now();
  if(S.cinema!==null && now-S.cinema>=GESAMT) stopCinema();
  render(now);
  requestAnimationFrame(schleife);
}

/* ============================ Bedienung ============================ */
const el=id=>document.getElementById(id);
function aktualisierePanel(){
  const le=letzteEuphorie();
  el("bm").classList.toggle("an", S.marker);
  el("lb").textContent=fmt(S.b,2);
  el("lj").textContent=String(S.jahr);
  el("k1").textContent=fmt(P[HEUTE])+" $";
  el("k2").textContent=fmt(Math.round(euroHeute()))+" $";
  el("k3").textContent=trefferBei(S.b)+" von "+ZH.length;
  el("k4").textContent=le>=0?dstr(le):"nie";
}
el("rb").addEventListener("input",e=>{ S.b=(+e.target.value)/100; });
el("rj").addEventListener("input",e=>{ S.jahr=+e.target.value; });
el("bm").addEventListener("click",()=>{ S.marker=!S.marker; });
el("tg").addEventListener("click",()=>{ const p=el("panel"); p.classList.toggle("zu");
  el("tg").innerHTML = p.classList.contains("zu")?"&#9658;":"&#9668;"; });
(function(){ const p=el("panel"), h=p.querySelector(".hd"); let dr=false,ox=0,oy=0;
  h.addEventListener("mousedown",e=>{dr=true;ox=e.clientX-p.offsetLeft;oy=e.clientY-p.offsetTop;});
  window.addEventListener("mousemove",e=>{ if(!dr)return;
    p.style.left=(e.clientX-ox)+"px"; p.style.top=(e.clientY-oy)+"px"; });
  window.addEventListener("mouseup",()=>dr=false); })();

/* ---------- Zeiger ---------- */
cv.addEventListener("mousemove",e=>{ S.hov={x:e.clientX, y:e.clientY}; });
cv.addEventListener("mouseleave",()=>{ S.hov=null; });
window.addEventListener("blur",()=>{ S.hov=null; });

/* ---------- Tastensteuerung ---------- */
let vorTaste=0, gespeichert=null;
function startCinema(){
  if(S.cinema!==null) return;
  gespeichert={b:S.b, jahr:S.jahr, marker:S.marker};
  S.cinema=performance.now();
  el("panel").style.opacity="0"; el("share").style.opacity="0";
}
function stopCinema(){
  S.cinema=null;
  if(gespeichert){
    S.b=gespeichert.b; S.jahr=gespeichert.jahr; S.marker=gespeichert.marker;
    el("rb").value=String(Math.round(S.b*100));
    el("rj").value=String(S.jahr);
    el("bm").classList.toggle("an", S.marker);
    gespeichert=null;
  }
  el("panel").style.opacity="1"; el("share").style.opacity="1";
}
window.addEventListener("keydown",e=>{
  const k=(e.key||"").toLowerCase();
  if(k==="escape"){ if(S.cinema!==null) stopCinema(); vorTaste=0; return; }
  if(k==="s"){ vorTaste=performance.now(); return; }
  if(k==="t"){ if(vorTaste && performance.now()-vorTaste<1200) startCinema(); vorTaste=0; return; }
  vorTaste=0;
});

/* ---------- Teilen ---------- */
function teilenText(){
  const eu=mvOf(0.60)*RP[HEUTE];
  return "Bitcoins Allzeithoch von "+fmt(K.ath_p)+" Dollar hat die Euphoriezone nie erreicht. "
    +"Die übliche Marke 0,75 hat seit "+K.eu75_jahr+" kein Signal mehr gegeben; bei 0,60 werden "
    +trefferBei(0.60)+" von "+ZH.length+" Zyklushochs erfasst. "
    +"Nicht der Markt hat die Euphorie verpasst — die Marke stand zu hoch: richtig geeicht beginnt sie erst bei "
    +fmt(Math.round(eu))+" Dollar.";
}
function zielURL(){ const h=location.href;
  return (h.length>2000 || h.slice(0,5)==="data:") ? "" : h; }
function fallback(txt){
  const ta=document.createElement("textarea"); ta.value=txt;
  ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function kopiere(txt,a){
  const fertig=()=>{ const sp=a.querySelector("span"); if(!sp) return;
    const alt=sp.getAttribute("data-alt")||sp.textContent;
    sp.setAttribute("data-alt",alt); sp.textContent="Text kopiert ✓";
    setTimeout(()=>{ sp.textContent=alt; },1800); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(fertig,()=>{fallback(txt);fertig();});
  } else { fallback(txt); fertig(); }
}
function oeffne(url,a){
  const w=window.open(url,"_blank","noopener,noreferrer");
  if(!w) kopiere(teilenText()+(zielURL()?" "+zielURL():""), a);
}
el("sw").href="https://wa.me/";
el("sx").href="https://x.com/intent/post";
el("sy").href="https://www.youtube.com/@WalletGreat";

el("sw").addEventListener("click",e=>{ e.preventDefault();
  oeffne("https://wa.me/?text="+encodeURIComponent(teilenText()+(zielURL()?" "+zielURL():"")), el("sw")); });
el("sx").addEventListener("click",e=>{ e.preventDefault();
  const u=zielURL();
  oeffne("https://x.com/intent/post?text="+encodeURIComponent(teilenText())+(u?"&url="+encodeURIComponent(u):""), el("sx")); });
el("sy").addEventListener("click",e=>{ e.preventDefault();
  oeffne("https://www.youtube.com/@WalletGreat", el("sy")); });
el("sl").addEventListener("click",e=>{ e.preventDefault();
  kopiere(teilenText()+(zielURL()?" "+zielURL():""), el("sl")); });

schleife();
